name: Continuos Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Baixa o histórico completo para o Super-Linter saber o que mudou
          fetch-depth: 0
      - name: Simulando Continuous Delivery
        uses: actions/upload-artifact@v7
        with:
          name: projeto.zip
          path: |
            meu_projeto.txt
            rotina_castiel.txt
            README.md

  deploy:
    runs-on: ubuntu-latest
    needs: deliver
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: projetozipado.zip
    - name: Display structure of downloaded files
      run: ls -R
