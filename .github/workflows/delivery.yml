name: Continuos Delivery

on:
  push:
    branches: [ "main" ]

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Baixa o histórico completo para o Super-Linter saber o que mudou
          fetch-depth: 0
          
      - name: Simulando Continuous Delivery
        uses: actions/upload-artifact@v4
        with:
          name: projeto.zip
          path: |
            meu_projeto.txt
            rotina_castiel.txt
            README.md

  docker:
    needs: deliver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (Baixar os arquivos)
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3

      - name: Build and push (Construir e Enviar)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false